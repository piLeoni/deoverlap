# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deoverlap"
version = "3.2.0"
authors = [
  { name="Pietro Leoni", email="pietro.leoni@gmail.com" },
]
description = "De-overlap Shapely geometries that sit within a tolerance of each other."
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Utilities",
]

dependencies = [
    "shapely>=2.0",
    "tqdm",
]

[project.optional-dependencies]
vpype = [
    "vpype>=1.13",
]
test = [
    "pytest",
    "matplotlib",
    "vpype>=1.13",
]

[project.urls]
Homepage = "https://github.com/piLeoni/deoverlap"
"Bug Tracker" = "https://github.com/piLeoni/deoverlap/issues"

[project.entry-points."vpype.plugins"]
deoverlap = "deoverlap.vpype_plugin:deoverlap_cmd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
