[package]
name = "deoverlap-node"
version = "4.2.0"
edition = "2021"
description = "Node.js bindings for deoverlap-core"
license = "MIT"
repository = "https://github.com/piLeoni/deoverlap"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
deoverlap-core = { path = "../../core" }
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
