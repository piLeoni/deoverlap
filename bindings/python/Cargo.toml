[package]
name = "deoverlap-python"
version = "4.1.0"
edition = "2021"
description = "Python bindings for deoverlap-core"
license = "MIT"
repository = "https://github.com/piLeoni/deoverlap"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
deoverlap-core = { path = "../../core" }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
