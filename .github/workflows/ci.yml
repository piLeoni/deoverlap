# Builds and tests one abi3 wheel per platform plus the sdist, and one Node
# addon per platform. Everything is uploaded as artifacts, not published;
# see docs/RELEASING.md.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  node:
    name: node (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build -- --target ${{ matrix.target }}
      - run: npm test
      - uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/*.node

  wheels:
    name: wheel (${{ matrix.os }}, ${{ matrix.target }}, ${{ matrix.libc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, libc: auto, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64, libc: auto, test: true }
          - { os: ubuntu-latest, target: x86_64, libc: musllinux_1_2, test: false }
          - { os: ubuntu-24.04-arm, target: aarch64, libc: musllinux_1_2, test: false }
          - { os: macos-15-intel, target: x86_64, libc: native, test: true }
          - { os: macos-latest, target: aarch64, libc: native, test: true }
          - { os: windows-latest, target: x64, libc: native, test: true }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.libc == 'native' && 'auto' || matrix.libc }}
          args: --release --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.libc }}
          path: dist
      - name: pytest
        if: matrix.test
        shell: bash
        run: |
          python -m pip install "$(ls dist/*.whl)[test]"
          python -m pytest

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist
